name: Windows desktop installer
concurrency:
  group: parrotassist-desktop-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --fetch-retries=2 --fetch-timeout=60000
      - name: Build Windows installer
        run: npm run desktop:build
      - name: Smoke-test Electron desktop bridge and local-only Ollama guard
        run: npm run desktop:smoke
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ParrotAssist-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
